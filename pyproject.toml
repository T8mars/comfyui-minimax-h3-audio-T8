[project]
name = "minimax-h3-audio-t8"
version = "1.19.0"
description = "MiniMax H3 Studio planning, bounded Qwen reference-prefix caching, activation chunking, environment auditing, audio, Hybrid experiments, multi-keyframe timelines, dialogue-safe mastering, speech, dual-clock sampling, resumable long video, and Ref2VA editing nodes for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
norecursedirs = ["artifacts"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["T201"]
