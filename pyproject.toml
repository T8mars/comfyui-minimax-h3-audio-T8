[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
norecursedirs = ["artifacts"]

[tool.ruff]
extend-exclude = ["h3_t8/flashvsr_vendor", "h3_t8/vendor/vretoucher_upstream", "h3_t8/veda_vendor"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["T201"]
