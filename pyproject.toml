[project]
name = "minimax-h3-audio-t8"
version = "1.30.1"
description = "MiniMax H3 SPEED spatial-progressive sampling, tail-detail schedules, joint AV flow experiments, native SAM3.1 multi-person face tracking, audio, Hybrid, multi-keyframe, speech, long-video, and Ref2VA nodes for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
norecursedirs = ["artifacts"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["T201"]
