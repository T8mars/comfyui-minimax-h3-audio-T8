[project]
name = "minimax-h3-audio-t8"
version = "1.15.0"
description = "MiniMax H3 audio, guarded Advanced VRAM/VBAR policy and hybrid-model experiments, multi-keyframe timelines, dialogue-safe mastering, source-video AV repaint preparation, speech workflows, dual-clock sampling, resumable long-video orchestration, and Ref2VA editing nodes for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
norecursedirs = ["artifacts"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["T201"]
