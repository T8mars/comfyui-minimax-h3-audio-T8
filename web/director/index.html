async function importFiles(files,route){if(!route)return;const owner=route.context??services.contextToken();const changed=()=>owner!==services.contextToken();const departed=()=>notify('项目已切换，上传结果未绑定到当前项目；请回原项目重新添加。');if(changed()){departed();return;}notify('正在上传素材，等待服务端确认…');const good=[],bad=[];for(const f of Array.from(files)){if(changed()){departed();return;}try{const a=await readAsset(f);good.push(a);}catch(e){bad.push(e.message);}if(changed()){departed();return;}}if(!good.length){notify(bad.join('；')||'没有选择文件');return;}for(const a of good)assets.set(a.id,a);
const before=referenceSnapshot();checkpoint();const live=doc.shots.find(s=>s.id===route.shot);let message='';
if(route.target==='global'){doc.sharedRefs.push(...good.map(a=>a.id));doc.shots.forEach(s=>s.rev++);if(good.length)sh().selected=good[0].id;message='全片素材已共享给所有镜头，包括以后新增的镜头。';}

if(route.target==='audio'&&a.kind==='audio'){live.audio=a.id;live.start=0;live.end=Number(a.duration.toFixed(3));}
else if(['first','last'].includes(route.target)&&a.kind==='image'&&i===0)assign(live,a.id,route.target);
else if(route.target==='two'&&a.kind==='image'&&i<2)assign(live,a.id,i===0?'first':'last');
else if(route.target==='refs'&&a.kind!=='audio'){live.refs.push(a.id);if(live.mode==='text')live.mode='refs';}
else if(route.target==='add'&&a.kind!=='audio'){if(live.mode==='refs')live.refs.push(a.id);else if(a.kind==='image'&&live.mode!=='text'&&!live.first)live.first=a.id;else if(a.kind==='image'&&live.mode==='ends'&&!live.last)live.last=a.id;}
}syncDuration(live);live.rev++;message='素材已显示在第 '+(doc.shots.indexOf(live)+1)+' 镜下方；可直接分配首帧、尾帧或参考用途。';}
else message='已添加到素材库；选择用途后绑定到镜头。';
reconcileTokens(before);view='input';pair=false;persist();render();if(route.target==='library')openLibrary(false);notify('已上传 '+good.length+' 项。'+message+(bad.length?' '+bad.join('；'):''));}

async function drawWave(a,s){const target=$('[data-wave]');if(!target)return;try{if(!a.peaks){audioContext??=new (window.AudioContext||window.webkitAudioContext)();const decoded=await audioContext.decodeAudioData(await a.file.arrayBuffer());const values=decoded.getChannelData(0),n=160,stride=Math.max(1,Math.floor(values.length/n));a.peaks=Array.from({length:n},(_,i)=>{let p=0;for(let j=i*stride;j<Math.min(values.length,(i+1)*stride);j+=Math.max(1,Math.floor(stride/200)))p=Math.max(p,Math.abs(values[j]));return p;});}if(!target.isConnected)return;const c=target.getContext('2d'),w=target.width,h=target.height;c.fillStyle='#101416';c.fillRect(0,0,w,h);c.fillStyle='#393024';c.fillRect(w*s.start/a.duration,0,w*(s.end-s.start)/a.duration,h);c.fillStyle='#dfc292';a.peaks.forEach((v,i)=>{const height=Math.max(1,v*h*.88);c.fillRect(i*w/a.peaks.length,(h-height)/2,2,height);});}catch(e){if(target.isConnected){const p=document.createElement('p');p.className='o-tip';p.textContent='此格式无法解码波形，仍可尝试播放器试听；没有绘制假波形。';target.replaceWith(p);}}}

root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.action==='delete-shot'){e.stopImmediatePropagation();askDelete('shot',sh().id);}else if(b.dataset.deleteAsset){e.stopImmediatePropagation();askDelete('asset',b.dataset.deleteAsset);}else if(b.hasAttribute('data-confirm-delete')){e.stopImmediatePropagation();confirmDelete();}else if(b.dataset.audioUse){e.stopImmediatePropagation();mutate(s=>{assign(s,b.dataset.id,'audio');s.sound=b.dataset.audioUse;});if($('[data-dialog]').open)$('[data-dialog]').close();notify(b.dataset.audioUse==='record'?'已选为音频驱动（drive_audio）：按原录音内容驱动，交付原录音。':'已选为参考音色：在提示词写新台词；不直接交付原录音。');}else if(b.dataset.action==='choose-audio'){e.stopImmediatePropagation();chooseExistingAudio();}},true);
// Rebuilding the thumbnail strip must retain delete/audio actions after selection.
const renderThumbsBase=renderThumbs;renderThumbs=function(){renderThumbsBase();decorateAssetDelete();};
root.addEventListener('click',e=>{const button=e.target.closest('[data-shot]');if(!button)return;e.stopImmediatePropagation();current=button.dataset.shot;view=directorOutputVideos(outputRecords.get(current)).length?'output':'input';pair=false;render();persist();},true);
services=makeDirectorServices({
 root,$,esc,notify,showDialog,tokenMap,checkpoint,openTasks:()=>workbench?.openTasks(),remapCreationAsset:(oldId,newId)=>remapCreationAsset(doc,oldId,newId),
 doc:()=>doc,assets:()=>assets,current:()=>current,versions:()=>resultVersions,selectedShotIds:()=>[...selectedShots],
 replace:(next,selected,media)=>{doc=next;current=selected;assets=media;outputRecords=new Map();resultVersions=[];previewVersions=new Map();selectedShots=new Set();view='input';lastTextTarget=null;},
 clearResults:()=>{outputRecords=new Map();resultVersions=[];previewVersions=new Map();selectedShots=new Set();view='input';render();},
 setResults:setOutputRecords,recordResult:recordOutput,
 locateIssue:issue=>{if(issue.shot_id&&doc.shots.some(s=>s.id===issue.shot_id))current=issue.shot_id;render();workbench.focusIssue(issue.field||'source');},

});
workbench=createDirectorWorkbench({root,doc:()=>doc,shot:sh,assets:()=>assets,results:()=>outputRecords,videos:directorOutputVideos,esc,effectiveD3,importFiles,view:()=>view,
 referenceContext,referenceChoices,insertReference:(id,query)=>insertAsset(id,query),
 creation:{
  context:()=>services.contextToken(),snapshot:()=>JSON.stringify(services.envelope()),items:()=>doc.creationLibrary?.items||[],target:()=>({...resolveInsertTarget()}),targetLabel,
  capture:(kind,name,target)=>captureCreation({doc,shot:sh(),assets:[...assets.values()],kind,name,id:uid(),target,d3:effectiveD3(sh())}),
  save:item=>{const next=addCreation(doc,item);checkpoint();doc=next;persist();summary();},
  rename:(id,name)=>{const next=renameCreation(doc,id,name);checkpoint();doc=next;persist();summary();},
  remove:id=>{checkpoint();doc.creationLibrary.items=doc.creationLibrary.items.filter(row=>row.id!==id);persist();summary();},
  plan:(item,target,fields,scope)=>{
   const targets=scope==='all'?doc.shots.map(row=>row.id):scope==='selected'?[...selectedShots]:[current];
   const plan=planCreation({doc,shotId:current,assets:[...assets.values()],item,target,fields,targets,uuid:uid});
   const changed=plan.doc.shots.filter(row=>JSON.stringify(row)!==JSON.stringify(doc.shots.find(old=>old.id===row.id)));
   plan.detail={kind:item.kind,fields:item.kind==='recipe'?fields:undefined,targets:changed.map(row=>({id:row.id,name:row.name})),globalChanged:doc.global!==plan.doc.global,source:item};
   if(item.kind==='recipe')plan.notes.unshift('将修改 '+changed.length+' 镜：'+changed.map(row=>row.name).join('、'));
   return plan;
  },
  apply:plan=>{checkpoint();doc=plan.doc;current=plan.current;lastTextTarget=null;view='input';persist();render();notify('已应用创作收藏，可一次撤销；没有提交生成，请保存项目。');}
 },
 creationSnapshot:()=>JSON.stringify(services.envelope()),importStoryboard:rows=>{
  const mode=doc.sharedRefs.some(id=>['image','video'].includes(assets.get(id)?.kind))?'refs':'text';
  const shots=rows.map(row=>({...makeShot(row.name,mode),duration:row.duration,manualDuration:row.duration,autoDuration:false,writingMode:'simple',simplePrompt:row.prompt,simpleInitialized:true,advancedInitialized:false,ownRatio:doc.ratio||'16:9'}));
  checkpoint();doc.shots.push(...shots);current=shots[0].id;lastTextTarget=null;view='input';syncRatios();persist();render();notify('已追加 '+shots.length+' 个镜头，可一次撤销；没有提交生成，请核对素材与全片设置。');
 },
 taskContext:()=>services.contextToken(),loadTasks:signal=>services.taskSnapshot(signal),locateTask:id=>{if(!doc.shots.some(s=>s.id===id)){notify('该镜头不在当前草稿，冻结任务仍保留。');return;}current=id;render();persist();workbench.focusIssue('prompt');},
 prepareBundle:include=>services.prepareBundle(include),buildBundle:plan=>services.buildBundle(plan),uploadBundle:(file,signal)=>services.uploadBundle(file,signal),applyBundle:plan=>services.applyBundle(plan),lastBundleImport:()=>services.lastBundleImport(),
 trim:{context:()=>services.contextToken(),snapshot:()=>JSON.stringify(services.envelope()),shot:sh,notify,prepare:key=>services.prepareFrame(key),
apply:(id,key,range)=>{const s=doc.shots.find(row=>row.id===id);if(!s||s!==sh()||s.adoptedResultId!==key)throw Error('采用版本已变化，请重新准备');checkpoint();if(range)s.filmTrim={...range};else delete s.filmTrim;persist();summary();renderStage();notify(range?'已保存采用范围，可撤销；原片和生成时长未变。请保存项目。':'已恢复采用完整原片，可撤销。请保存项目。');}},
 frame:{context:()=>services.contextToken(),snapshot:()=>JSON.stringify(services.envelope()),current:()=>current,escape:esc,notify,
  prepare:key=>services.prepareFrame(key),extract:(film,frame)=>services.extractFrame(film,frame),
  targets:source=>{const index=doc.shots.findIndex(row=>row.id===source),next=doc.shots[index+1];return index>=0&&next?[{id:next.id,name:'下一镜 · '+next.name,first:next.first}]:[];},
  apply:(source,target,asset,replace)=>{
   const index=doc.shots.findIndex(row=>row.id===source);if(index<0||!asset||asset.kind!=='image')throw Error('源镜头或提取图片已无效');
   let next=doc.shots[index+1];if(target!=='new'&&next?.id!==target)throw Error('下一镜位置已变化，请重新准备');
   if(target!=='new'&&next.first&&!replace)throw Error('请明确确认替换下一镜已有首帧');
   const before=new Map(doc.shots.map(row=>[row.id,tokenMap(row)]));checkpoint();assets.set(asset.id,asset);
   if(target==='new'){next=makeShot(('接镜 · '+doc.shots[index].name).slice(0,200));normalizeWriting(next);next.ownRatio=doc.ratio||'16:9';doc.shots.splice(index+1,0,next);}
   next.tray=[...new Set([...(next.tray||[]),next.first,next.last,...next.refs,asset.id].filter(Boolean))];next.first=asset.id;next.mode=next.last?'ends':'first';next.selected=asset.id;next.rev++;
   reconcileTokens(before);syncRatios();current=next.id;view='input';lastTextTarget=null;persist();render();notify('已将完整静态帧设为下一镜首帧，可一次撤销；原成片、声音用途和旧素材保留，没有自动生成。');
  }},
 prepareFilm:()=>services.prepareFilm(),prepareComparison:keys=>services.prepareComparison(keys),notify,locateShot:id=>{if(!doc.shots.some(s=>s.id===id)){notify('镜头已不在当前草稿。');return;}current=id;view='output';render();persist();},
 startFilmExport:(film,options)=>services.startFilmExport(film,options),filmExportStatus:target=>services.filmExportStatus(target),
 checkedCanvas:()=>services.checkedCanvas(),selectedShotIds:()=>[...selectedShots],selectShot:(id,checked)=>{if(checked)selectedShots.add(id);else selectedShots.delete(id);},
 moveShot:(id,target)=>{const next=moveDirectorShot(doc.shots,id,target);if(next===doc.shots)return;checkpoint();doc.shots=next;persist();render();notify('已调整镜头顺序；已有成片仍跟随原镜头，运行中的冻结批次顺序不变。');},
 versions:()=>resultVersions.filter(item=>item.shot_id===current),resultKey:directorResultKey,
 previewVersion:key=>{previewVersions.set(current,key);rebuildOutputRecords();view='output';renderStage();},
 adoptVersion:key=>{const item=resultVersions.find(item=>item.shot_id===current&&directorResultKey(item)===key);if(item?.state!=='success'||!directorOutputVideos(item).length){notify('只能采用有成片的成功版本。');return;}checkpoint();const changed=sh().adoptedResultId!==key;if(changed)delete sh().filmTrim;sh().adoptedResultId=key;previewVersions.delete(current);rebuildOutputRecords();persist();summary();renderStage();notify('已采用此版，采用范围已恢复全片；后续生成不会自动替换。请保存项目。');},
 showVersion:item=>services.showVersion(item).catch(error=>notify(error.message))});
