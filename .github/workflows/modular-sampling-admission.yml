name: Modular sampling admission

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the bounded reviewed INT8 delta and unknown-call rejection
        run: python3 tests/test_h09_sampling_admission_ci.py
      - name: Verify the reviewed H21 source delta and reject changed or future calls
        run: python3 tests/test_h21_sampling_admission_ci.py
      - name: Verify the explicit H24 successor and retain negative source checks
        run: python3 tests/test_h24_sampling_admission_ci.py
      - name: Reject unreviewed sampling or Director graph-builder changes
        run: python3 tools/audit_modular_new_sampling.py guard
